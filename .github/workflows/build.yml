name: Build and test

on: [push, pull_request]

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            qt-arch: clang_64
          - os: windows-2022
            qt-arch: win64_msvc2022_64

    steps:
      - uses: actions/checkout@v5.1.0
        with:
          persist-credentials: false
      - uses: jurplel/install-qt-action@v4.5.0
        with:
          version: '6.10.3'
          arch: ${{ matrix.qt-arch }}
          archives: qtbase qtdeclarative qttools
          cache: true
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build --config Release --parallel 2
      - run: ctest --test-dir build --build-config Release --output-on-failure
      - name: Print QML test results on failure
        if: failure()
        shell: bash
        run: |
          if [[ -f build/qml-test-results.txt ]]; then cat build/qml-test-results.txt; fi
